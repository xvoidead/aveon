  <header class="titlebar">
    <div class="win-buttons">
      <button data-win="min" aria-label="Свернуть"><svg><use href="#i-min"/></svg></button>
      <button data-win="max" aria-label="Развернуть"><svg><use href="#i-max"/></svg></button>
      <button data-win="close" class="win-close" aria-label="Закрыть"><svg><use href="#i-close"/></svg></button>
    </div>
  </header>

  <!-- Бочка: сейчас играет. Обручи, обложка и спектр реагируют на силу эффекта (--m) -->
  <section class="stage" id="stage">
    <div class="barrel" id="barrel">
      <canvas id="viz" class="viz"></canvas>
      <svg class="hoops" viewBox="0 0 320 320" aria-hidden="true">
        <circle cx="160" cy="160" r="150" class="hoop hoop-outer"/>
        <circle cx="160" cy="160" r="138" class="hoop"/>
        <circle cx="160" cy="160" r="104" class="hoop hoop-inner"/>
      </svg>
      <div class="porthole" id="now-cover"><span class="porthole-empty">♪</span></div>
      <div class="in-barrel" id="in-barrel">в бочке</div>
    </div>

    <div class="now">
      <div class="now-title" id="now-title">Ничего не играет</div>
      <div class="now-artist" id="now-artist">Выбери трек в библиотеке справа</div>
      <div class="now-via" id="now-via" hidden></div>
    </div>

    <button class="together-chip idle" id="together-chip" aria-haspopup="dialog" aria-expanded="false"><svg class="together-chip-icon"><use href="#i-together"/></svg><i class="together-dot"></i><span class="together-faces" id="together-chip-faces"></span><span id="together-chip-text"></span></button>

    <div class="progress-row">
      <span class="time" id="time-cur">0:00</span>
      <div class="slider progress" id="progress"><div class="slider-buf" id="progress-buf"></div><div class="slider-fill" id="progress-fill"></div><div class="slider-knob"></div><span class="seek-tip" id="seek-tip">0:00</span></div>
      <span class="time" id="time-dur">0:00</span>
    </div>

    <div class="controls">
      <button class="icon-btn toggle" id="btn-shuffle" aria-label="Перемешать"><svg><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" id="btn-prev" aria-label="Предыдущий трек"><svg><use href="#i-prev"/></svg></button>
      <button class="play-btn" id="btn-play" aria-label="Играть"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="btn-next" aria-label="Следующий трек"><svg><use href="#i-next"/></svg></button>
      <button class="icon-btn toggle" id="btn-repeat" aria-label="Повтор"><svg><use href="#i-repeat"/></svg><i class="repeat-one">1</i></button>
    </div>

    <div class="volume-row">
      <button class="icon-btn small" id="btn-mute" aria-label="Выключить звук"><svg><use href="#i-vol"/></svg></button>
      <div class="slider volume" id="volume"><div class="slider-fill" id="volume-fill"></div><div class="slider-knob"></div></div>
      <div class="volume-tools">
      <button class="icon-btn small" id="btn-eq" aria-label="Эквалайзер" title="Эквалайзер (E)" aria-pressed="false"><svg><use href="#i-eq"/></svg></button>
      <button class="icon-btn small" id="btn-lyrics" aria-label="Текст песни" title="Текст песни (L)" aria-pressed="false"><svg><use href="#i-lyrics"/></svg></button>
      <button class="icon-btn small" id="btn-fs" aria-label="Во весь экран" title="Во весь экран (F)"><svg><use href="#i-full"/></svg></button>
      <button class="icon-btn small" id="btn-now-album" aria-label="Добавить в альбом" title="Добавить в альбом" disabled><svg><use href="#i-album-add"/></svg></button>
      </div>
    </div>

    <!-- низ сцены: Discord (звонок) и аккаунт -->
    <div class="stage-foot">
      <div class="call" id="discord">
        <div class="call-head">
          <span class="call-state" id="duck-chip">Discord запускается</span>
          <button class="btn duck-manual mobile-only" id="duck-manual" aria-pressed="false" title="Бочка вручную">в бочку</button>
          <label class="switch" title="Эффект в звонке">
            <input type="checkbox" id="duck-enabled" aria-label="Эффект в звонке"><span></span>
          </label>
        </div>
        <div class="meters">
          <span class="meter-label">Собеседники</span>
          <div class="meter" id="meter" title="Нажми, чтобы задать порог">
            <div class="meter-fill" id="meter-fill"></div>
            <div class="meter-threshold" id="meter-threshold"></div>
          </div>
          <span class="meter-label">Ты</span>
          <div class="meter mic" id="mic-meter" title="Твой голос после шумоподавления">
            <div class="meter-fill" id="mic-fill"></div>
            <div class="meter-threshold" id="mic-threshold"></div>
          </div>
        </div>
      </div>

      <!-- аккаунт: профиль и статистика, рядом настройки -->
      <div class="stage-account">
        <button class="me" id="open-profile" aria-label="Профиль и статистика" aria-expanded="false">
          <span class="me-avatar" id="me-avatar">?</span>
          <span class="me-text"><b id="me-name"></b><small id="me-sub"></small></span>
        </button>
        <button class="icon-btn" id="open-settings" aria-label="Настройки" title="Настройки (Ctrl+,)"><svg><use href="#i-settings"/></svg></button>
      </div>
    </div>
  </section>

  <main class="library" id="content">
    <div class="lib-top">
      <nav class="sources" id="sources">
        <button class="source" data-view="local">Мои файлы</button>
        <button class="source" data-view="artists">Артисты</button>
        <button class="source" data-view="albums">Альбомы</button>
        <button class="source" data-view="ym">Яндекс Музыка</button>
        <button class="source" data-view="sc">SoundCloud</button>
        <button class="source" data-view="sp">Spotify</button>
      </nav>
      <button class="icon-btn" id="open-friends" aria-label="Друзья" title="Друзья" aria-expanded="false"><svg><use href="#i-friends"/></svg><i class="badge" id="friends-badge" hidden></i></button>
    </div>

    <form class="search" id="search-form" autocomplete="off">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Поиск" spellcheck="false">
    </form>

    <!-- плейлисты листаются колесом, стрелками по краям и перетаскиванием -->
    <div class="collections-wrap" id="collections-wrap">
      <button class="coll-arrow l" data-dir="-1" tabindex="-1" aria-hidden="true"><svg><use href="#i-chevron-l"/></svg></button>
      <div class="collections" id="collections"></div>
      <button class="coll-arrow r" data-dir="1" tabindex="-1" aria-hidden="true"><svg><use href="#i-chevron-r"/></svg></button>
    </div>

    <div class="lib-head">
      <div>
        <h1 id="view-title">Мои файлы</h1>
        <p id="view-sub" class="muted"></p>
      </div>
      <div class="head-actions" id="head-actions"></div>
    </div>

    <div class="tracklist" id="tracklist"></div>
    <div class="empty" id="empty" hidden></div>

    <!-- профиль поверх библиотеки: рисует profile.js, статистику внутри — extras.js -->
    <section class="profile" id="profile" hidden aria-label="Профиль">
      <div class="profile-scroll">
        <button class="btn pf-back" id="profile-close"><svg><use href="#i-chevron-l"/></svg>К музыке</button>
        <header class="pf-hero" id="pf-hero"></header>
        <div class="pf-grid">
          <section class="pf-card pf-wide" id="pf-connected"></section>
          <section class="pf-card pf-wide stats" id="stats" aria-label="Статистика"></section>
          <section class="pf-card" id="pf-devices"></section>
          <section class="pf-card" id="pf-account"></section>
        </div>
      </div>
    </section>

    <section class="lyrics" id="lyrics" hidden aria-label="Текст песни">
      <div class="lyrics-head">
        <div class="lyrics-meta" id="lyrics-meta"></div>
        <button class="icon-btn" id="lyrics-close" aria-label="Закрыть текст"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="lyrics-body" id="lyrics-body"></div>
    </section>
  </main>

  <section class="fs" id="fs" hidden aria-label="Во весь экран">
    <div class="fs-bg" id="fs-bg"></div>
    <button class="icon-btn fs-exit" id="fs-exit" aria-label="Выйти из полноэкранного режима" title="Выйти (Esc)"><svg><use href="#i-close"/></svg></button>
    <div class="fs-main">
      <div class="fs-now">
        <div class="fs-cover" id="fs-cover"></div>
        <div class="fs-title" id="fs-title"></div>
        <div class="fs-artist" id="fs-artist"></div>
        <div class="fs-seek">
          <span class="time" id="fs-cur">0:00</span>
          <div class="slider progress" id="fs-progress"><div class="slider-fill"></div><div class="slider-knob"></div></div>
          <span class="time" id="fs-dur">0:00</span>
        </div>
        <div class="fs-controls">
          <button class="icon-btn" id="fs-prev" aria-label="Предыдущий трек"><svg><use href="#i-prev"/></svg></button>
          <button class="play-btn" id="fs-play" aria-label="Играть"><svg><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="fs-next" aria-label="Следующий трек"><svg><use href="#i-next"/></svg></button>
        </div>
      </div>
      <div class="fs-lyrics" id="fs-lyrics"></div>
    </div>
  </section>

  <!-- настройки: разделы слева, содержимое раздела справа (app.js → renderSettings) -->
  <div class="modal" id="settings" hidden>
    <div class="sheet settings-sheet" role="dialog" aria-labelledby="set-title">
      <nav class="set-nav" id="set-nav" aria-label="Разделы настроек"></nav>
      <div class="set-main">
        <div class="sheet-head">
          <h2 id="set-title">Настройки</h2>
          <button class="icon-btn" id="close-settings" aria-label="Закрыть"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="sheet-body" id="settings-body"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="editor" hidden>
    <form class="sheet editor" id="editor-form" role="dialog" aria-labelledby="editor-title" autocomplete="off">
      <div class="sheet-head">
        <h2 id="editor-title">Теги трека</h2>
        <button type="button" class="icon-btn" id="editor-close" aria-label="Закрыть"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="editor-body">
        <div class="editor-cover">
          <button type="button" class="editor-art" id="editor-art" aria-label="Сменить обложку"></button>
          <div class="editor-art-actions">
            <button type="button" class="btn" id="editor-pick">Выбрать картинку</button>
            <button type="button" class="btn" id="editor-nocover">Без обложки</button>
          </div>
        </div>
        <div class="editor-fields">
          <label>Название<input class="input" id="ed-title" spellcheck="false" maxlength="200" required></label>
          <label>Исполнитель<input class="input" id="ed-artist" spellcheck="false" maxlength="200"></label>
          <label>Альбом<input class="input" id="ed-album" spellcheck="false" maxlength="200"></label>
          <p class="editor-file" id="editor-file"></p>
        </div>
      </div>
      <div class="editor-lookup">
        <button type="button" class="btn" id="editor-find"><svg><use href="#i-search"/></svg>Найти теги и обложку в интернете</button>
        <div class="lookup-results" id="lookup-results"></div>
      </div>
      <div class="editor-foot">
        <button type="button" class="btn" id="editor-reset">Вернуть теги из файла</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="editor-cancel">Отмена</button>
        <button type="submit" class="btn primary" id="editor-save">Сохранить</button>
      </div>
    </form>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>

  <!-- Слушать вместе: рума по коду. Открывается с плашки на сцене и встаёт под ней, содержимое рисует together.js -->
  <section class="together on-stage" id="together" role="dialog" aria-label="Слушать вместе" hidden></section>

  <!-- Друзья: заявки по логину и что они слушают, содержимое рисует friends.js -->
  <section class="together friends" id="friends" role="dialog" aria-label="Друзья" hidden></section>

  <div class="modal" id="dialog" hidden>
    <form class="sheet dialog" id="dialog-form" role="dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <p class="sec-desc" id="dialog-text"></p>
      <input class="input" id="dialog-input" spellcheck="false" maxlength="80">
      <div class="dialog-actions">
        <button type="button" class="btn" id="dialog-cancel">Отмена</button>
        <button type="submit" class="btn primary" id="dialog-ok"></button>
      </div>
    </form>
  </div>

  <!-- Вход в аккаунт: без него плеер закрыт. Та же раскладка, что у плеера: слева пустая бочка, справа форма -->
  <div class="auth" id="auth" hidden>
    <aside class="auth-stage" aria-hidden="true">
      <div class="brand">авеон</div>
      <div class="barrel auth-barrel">
        <svg class="hoops" viewBox="0 0 320 320">
          <circle cx="160" cy="160" r="150" class="hoop hoop-outer"/>
          <circle cx="160" cy="160" r="138" class="hoop"/>
          <circle cx="160" cy="160" r="104" class="hoop hoop-inner"/>
        </svg>
        <div class="porthole"><span class="porthole-empty">♪</span></div>
      </div>
      <p class="auth-tagline">музыка уходит в бочку,<br>когда в discord говорят</p>
    </aside>

    <main class="auth-main">
      <form class="auth-form" id="auth-form" autocomplete="off" novalidate>
        <h1 class="auth-title" id="auth-title">вход</h1>
        <p class="auth-sub" id="auth-sub"></p>

        <div class="auth-server" id="auth-server-line" hidden>
          <span>сервер <b id="auth-server-host"></b></span>
          <button type="button" class="auth-link" id="auth-server-edit">изменить</button>
        </div>
        <label class="auth-field" id="auth-server-field">адрес сервера
          <input class="input" id="auth-server" placeholder="1.2.3.4:8787" spellcheck="false"></label>
        <label class="auth-field">логин
          <input class="input" id="auth-login" spellcheck="false" maxlength="32" autocomplete="username"></label>
        <label class="auth-field">пароль
          <input class="input" id="auth-password" type="password" maxlength="256"></label>
        <label class="auth-field" id="auth-password2-field">пароль ещё раз
          <input class="input" id="auth-password2" type="password" maxlength="256"></label>

        <p class="auth-error" id="auth-error" role="alert"></p>
        <button class="btn primary auth-go" type="submit" id="auth-go"></button>
        <p class="auth-switch"><span id="auth-switch-text"></span> <button type="button" class="auth-link" id="auth-switch"></button></p>
      </form>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="drop-hint" id="drop-hint" hidden>Отпусти файлы, чтобы включить</div>

  <audio id="audio" crossorigin="anonymous" preload="auto"></audio>
  <audio id="audio2" crossorigin="anonymous" preload="auto"></audio>
  <script src="../node_modules/hls.js/dist/hls.light.min.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
  <script src="eq-core.js"></script>
  <script src="eq.js"></script>
  <script src="fullscreen.js"></script>
  <script src="censor.js"></script>
  <script src="artists.js"></script>
  <script src="together.js"></script>
  <script src="friends.js"></script>
  <script src="share.js"></script>
  <script src="profile.js"></script>
  <script src="presence.js"></script>
  <script src="cache.js"></script>
  <script src="look.js"></script>
</body>
</html>
